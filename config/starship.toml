add_newline = false
format = "$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"
[username]
show_always = true
style_user = "#798c94"
style_root = "#d4bc73"
format = "[$user]($style)"
[hostname]
ssh_only = false
style = "#798c94"
format = "[@$hostname ]($style)"
[directory]
style = "#7fc0db"
format = "[$path]($style) "
truncation_length = 3
read_only = " [RO]"
[git_branch]
symbol = "󰘬 "
style = "#83a5cc"
format = "[$symbol$branch]($style) "
[git_status]
style = "#d4bc73"
format = "([$all_status$ahead_behind]($style) )"
[cmd_duration]
min_time = 2000
style = "#798c94"
format = "[$duration]($style)"
[character]
success_symbol = "[›](#7fc0db)"
error_symbol = "[›](#d4bc73)"
vimcmd_symbol = "[‹](#83a5cc)"

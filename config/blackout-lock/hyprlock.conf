# Pixel Lunar — colors follow the system palette managed by blackout.
source = ~/.config/blackout-lock/colors.conf
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}
auth {
    pam {
        enabled = true
        module = swaylock
    }
    fingerprint {
        enabled = true
        ready_message = Scan your fingerprint to unlock
        present_message = Scanning fingerprint...
        retry_delay = 500
    }
}
animations {
    enabled = false
}
background {
    monitor =
    path = ~/.dotfiles/assets/blackout/lock.png
    color = $lock_bg
    blur_passes = 0
    blur_size = 5
    brightness = 0.55
}
label {
    monitor =
    text = BLACKOUT / LOCKED
    color = $lock_accent
    font_size = 13
    font_family = Iosevka
    position = 0, 230
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = $lock_fg
    font_size = 64
    font_family = Iosevka
    position = 0, 125
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date '+%A, %d %B'
    color = $lock_muted
    font_size = 18
    font_family = Iosevka
    position = 0, 35
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 56
    position = 0, -65
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 1
    inner_color = $lock_surface
    outer_color = $lock_edge
    check_color = $lock_accent
    fail_color = $lock_warn
    font_color = $lock_fg
    font_family = Iosevka
    placeholder_text = Password
    fail_text = Authentication failed
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.5
}
label {
    monitor =
    text = $FPRINTPROMPT
    color = $lock_accent
    font_size = 15
    font_family = Iosevka
    position = 0, -125
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT
    color = $lock_muted
    font_size = 13
    font_family = Iosevka
    position = 0, -170
    halign = center
    valign = center
}

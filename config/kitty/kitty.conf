include colors.conf
font_family family="JetBrainsMono Nerd Font Mono" style=SemiBold
bold_font family="JetBrainsMono Nerd Font Mono" style=Bold
italic_font family="JetBrainsMono Nerd Font Mono" style="SemiBold Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size 12.0
shell fish
background_opacity 0.88
dynamic_background_opacity yes
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines 20000
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.10 0.24
cursor_trail_start_threshold 2
symbol_map U+F0000-U+FFFFD Symbols Nerd Font Mono
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+backspace change_font_size all 0
